[package]
name = "dsh-hub"
version = "0.0.0"
description = "DeepSeek Harness Hub — Tauri 2.x desktop shell (WebView2/WebKit/WKWebView)"
authors = ["MarecGents"]
edition = "2021"
publish = false

[lib]
# Tauri template convention: lib crate name = <package>_lib (main.rs calls dsh_hub_lib::run()).
name = "dsh_hub_lib"
# Tauri requires this crate-type for both static and dynamic linking.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# deep-link: enabled at M5 per the deep-link decision (SOP §2.4 T1.1); kept
# out of capabilities until then.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"

# Windows DWM 暗色标题栏（T2.3 theme.rs，参照 spacedrive windows.rs L627-697）。
# + IShellLink/IPersistFile/IPropertyStore（Q3：开始菜单+桌面快捷方式注册 AUMID，
#   未打包应用 toast 显示 + 用户手动启动入口）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
] }

[features]
# The custom-protocol feature is required when the frontendDist is served via
# the custom protocol in release builds.
custom-protocol = ["tauri/custom-protocol"]
