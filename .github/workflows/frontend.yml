name: frontend

# Frontend + release-process quality gate (2026-09-01 audit):
#  - tsc (strict) must stay clean — previously only verified locally,
#    a regression could slip into a release;
#  - lib/ must stay in sync with src/ (verify-release P3: lib zero-drift);
#  - verify-release ALL PASS mirrors the release pipeline's own gate so CI
#    catches version/identity/drift problems before a publish attempt.
# Runs on any push touching src/, plugins/, package.json, tsconfig or
# the verify script; the Rust half has its own workflow (rust.yml).

on:
  push:
    branches: [dev-v2, main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'scripts/verify-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'cordis.patch.yml'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'scripts/verify-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'cordis.patch.yml'
      - '.github/workflows/frontend.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the same build order as the release pipeline (tsc first, then
      # the client bundle). The client tsc pass resolves SDK types from the
      # committed lib/ output and does not need the SDK links.
      - name: TypeScript (strict)
        run: npm run build

      # The @deepseek-ai/dsh-* client SDK ships only inside an installed
      # dsh CLI (vendored tree, not on npm), so GitHub runners cannot build
      # lib/client.js. DSH_CLIENT_SDK_OPTIONAL=1 makes build-client.mjs skip
      # with a warning instead of failing; the release pipeline builds the
      # real bundle on a machine with a dsh install.
      - name: Client bundle
        env:
          DSH_CLIENT_SDK_OPTIONAL: '1'
        run: npm run build:client

      - name: Release-process gate (verify-release)
        # P3 requires lib/ to be committed — the checkout is fresh, so this
        # also proves the committed lib/ matches the freshly built one.
        run: node scripts/verify-release.mjs
